# /etc/nginx/sites-available/biblioteca-cif
#
# Reemplazá "tu-dominio.com" por el dominio o IP real del servidor.
# Si usás HTTPS (recomendado), descomentá el bloque SSL.

server {
    listen 80;
    server_name tu-dominio.com www.tu-dominio.com;

    # ── Redirigir HTTP → HTTPS (descomentá cuando tengas certificado) ──
    # return 301 https://$host$request_uri;

    # ── Raíz del frontend compilado ──────────────────────────────────────
    root /var/www/biblioteca-cif;
    index index.html;

    # ── API / backend (proxy hacia Node.js en :3001) ──────────────────────
    location /api/ {
        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # ── Frontend (React SPA) ──────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Seguridad extra ───────────────────────────────────────────────────
    add_header X-Content-Type-Options  "nosniff"   always;
    add_header X-Frame-Options         "SAMEORIGIN" always;
    add_header X-XSS-Protection        "1; mode=block" always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;

    # Ocultar versión de Nginx
    server_tokens off;
}

